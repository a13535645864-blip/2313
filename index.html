<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AIGC Workflow | Mobile Adapted</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap');

    :root {
      --app-bg: #f0f2f5;
      --slide-bg: rgba(255, 255, 255, 0.85);
      --slide-border: rgba(255, 255, 255, 0.6);
      
      --accent: #FF4D00; 
      --green: #00CC66;
      --text-main: #1d1d1f;
      --locked-color: #ff4d4f;
      --selection-color: #2953FF;
      
      --glass-blur: 50px;
      --slide-shadow: 0 40px 100px -20px rgba(0,0,0,0.15);
      --slide-base-w: 1600px;
      --slide-base-h: 900px;
      --scale: 1;

      --font-stack: "Inter", "Noto Sans SC", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; touch-action: none; /* 禁止浏览器默认缩放手势 */ }
    
    /* 允许文本编辑区域输入 */
    [contenteditable="true"] { user-select: text; -webkit-user-select: text; cursor: text; touch-action: manipulation; }

    body { margin: 0; background: var(--app-bg); color: var(--text-main); font-family: var(--font-stack); overflow: hidden; -webkit-font-smoothing: antialiased; width: 100vw; height: 100vh; }

    #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    .scroller { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; position: relative; z-index: 10; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .scroller::-webkit-scrollbar { width: 0; }

    section { height: 100vh; width: 100vw; scroll-snap-align: center; display: flex; justify-content: center; align-items: center; position: relative; }

    .scaler-wrap { width: var(--slide-base-w); height: var(--slide-base-h); transform: scale(var(--scale)); transform-origin: center center; box-shadow: var(--slide-shadow); transition: transform 0.3s; }
    
    .slide-frame { 
      width: 100%; height: 100%; 
      background: var(--slide-bg); 
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--slide-border); 
      border-radius: 24px; 
      position: relative; overflow: hidden; 
      contain: layout style;
      transform: translate3d(0,0,0);
    }

    .pg-num { position: absolute; bottom: 30px; left: 50px; font-family: monospace; color: #888; font-size: 14px; pointer-events: none; z-index: 2; }

    /* --- 组件系统 --- */
    .comp { position: absolute; display: flex; flex-direction: column; justify-content: center; border: 1px solid transparent; transition: border 0.1s; z-index: 10; transform: translate3d(0,0,0); }
    .comp.selected { border: 1px solid var(--selection-color); z-index: 100; background: rgba(41, 83, 255, 0.05); }
    .comp.locked { border-color: var(--locked-color) !important; border-style: dashed; pointer-events: auto !important; }
    .comp.locked .drag-bar, .comp.locked .resize-handle { display: none !important; }
    
    /* 拖拽条在手机上加大触控区域 */
    .drag-bar { height: 24px; width: 100%; background: #222; cursor: grab; position: absolute; top: -24px; left: 0; border-radius: 4px 4px 0 0; opacity: 0; transition: 0.2s; pointer-events: auto; }
    .comp:hover .drag-bar, .comp.selected .drag-bar { opacity: 1; }
    
    .resize-handle { width: 20px; height: 20px; background: var(--selection-color); position: absolute; bottom: -10px; right: -10px; cursor: nwse-resize; border-radius: 50%; opacity: 0; transition: 0.2s; pointer-events: auto; z-index: 101;}
    .comp:hover .resize-handle, .comp.selected .resize-handle { opacity: 1; }

    .comp-content { width: 100%; height: 100%; position: relative; overflow: visible; font-family: inherit; line-height: 1.5; color: inherit; }
    .comp[data-type="media"] .comp-content img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; border-radius: 6px; display: block; -webkit-user-select: none; will-change: transform; -webkit-backface-visibility: hidden; }
    .comp.placeholder { border: 2px dashed #ccc; border-radius: 12px; background: rgba(0,0,0,0.02); }
    .comp.placeholder .comp-content { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa; font-size: 14px; pointer-events: none; }

    /* Loading Spinner */
    .loader-overlay {
        position: absolute; top:0; left:0; width:100%; height:100%;
        background: rgba(255,255,255,0.8);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 200; font-size: 14px; color: #666;
    }
    .spinner {
        width: 30px; height: 30px; border: 3px solid #eee;
        border-top-color: var(--accent); border-radius: 50%;
        animation: spin 1s linear infinite; margin-bottom: 8px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* --- 动效 --- */
    .animate-in { opacity: 0; }
    .active .animate-in { animation: blurFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes blurFadeIn { from { opacity: 0; transform: translateY(40px) scale(0.98); filter: blur(10px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

    .anim-top { opacity: 0; } .active .anim-top { animation: insertTop 1s ease forwards; }
    @keyframes insertTop { from { opacity: 0; transform: translateY(-150px); filter: blur(20px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    .anim-bottom { opacity: 0; } .active .anim-bottom { animation: insertBottom 1s ease forwards; }
    @keyframes insertBottom { from { opacity: 0; transform: translateY(150px); filter: blur(20px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    
    .corner-tl { opacity: 0; } .active .corner-tl { animation: flyTL 1s ease forwards; }
    @keyframes flyTL { from { opacity: 0; transform: translate(-100px, -100px); filter: blur(20px); } to { opacity: 1; transform: translate(0,0); filter: blur(0); } }
    .corner-tr { opacity: 0; } .active .corner-tr { animation: flyTR 1s ease forwards; }
    @keyframes flyTR { from { opacity: 0; transform: translate(100px, -100px); filter: blur(20px); } to { opacity: 1; transform: translate(0,0); filter: blur(0); } }
    .corner-bl { opacity: 0; } .active .corner-bl { animation: flyBL 1s ease forwards; }
    @keyframes flyBL { from { opacity: 0; transform: translate(-100px, 100px); filter: blur(20px); } to { opacity: 1; transform: translate(0,0); filter: blur(0); } }
    .corner-br { opacity: 0; } .active .corner-br { animation: flyBR 1s ease forwards; }
    @keyframes flyBR { from { opacity: 0; transform: translate(100px, 100px); filter: blur(20px); } to { opacity: 1; transform: translate(0,0); filter: blur(0); } }

    .sticker-slap { opacity: 0; transform-origin: center center; }
    .active .sticker-slap { animation: stickerSlapAnim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes stickerSlapAnim { 0% { opacity: 0; transform: scale(2) rotate(15deg); filter: blur(10px); } 100% { opacity: 1; transform: scale(1) rotate(-2deg); filter: blur(0); } }

    /* Parabola */
    .parabola-container { width: 100%; height: 100%; position: relative; pointer-events: none; z-index: 0; }
    .para-path { fill: none; stroke: url(#grad1); stroke-width: 4; stroke-linecap: round; }
    .para-ball { 
        offset-path: path("M 100 50 Q 600 450 1100 50"); 
        width: 30px; height: 30px; border-radius: 50%; 
        position: absolute; top:0; left:0; 
        animation: moveBall 5s infinite cubic-bezier(0.45, 0, 0.55, 1) normal; 
    }
    @keyframes moveBall { 
        0% { offset-distance: 0%; background-color: var(--accent); box-shadow: 0 0 15px var(--accent); } 
        40% { background-color: #ff8800; box-shadow: 0 0 30px #ff8800; }
        100% { offset-distance: 100%; background-color: var(--green); box-shadow: 0 0 40px var(--green), 0 0 10px #fff; } 
    }

    /* --- V32: Flip Card & Zoom --- */
    .slider-container { 
        position: absolute; 
        top: 130px; left: 50px; 
        width: 1500px; height: 680px; 
        overflow: visible; border-radius: 20px; 
        pointer-events: auto; transition: all 0.5s; z-index: 20;
    }
    .slider-track { display: flex; gap: 30px; padding: 20px; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), gap 0.5s, width 0.5s; width: max-content; align-items: center; }
    .slider-track.finale-mode { width: 100%; gap: 40px; justify-content: center; padding: 40px 0; transform: translateX(0) !important; }
    
    .slider-item { width: 300px; height: 570px; flex-shrink: 0; position: relative; perspective: 1000px; -webkit-perspective: 1000px; transition: opacity 0.5s, width 0.5s, height 0.5s; }
    .slider-track.finale-mode .slider-item { width: 220px; height: 420px; }
    .slider-track.finale-mode .slider-item .card-back { font-size: 140px; }
    
    .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
    .slider-item.flipped .card-inner { transform: rotateY(180deg); }
    
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 16px; transition: font-size 0.5s; top: 0; left: 0; overflow: hidden; }
    
    .card-front { background: #f5f5f7; z-index: 2; transform: rotateY(0deg); display: flex; align-items: center; justify-content: center; border: 3px dashed #e0e0e0; cursor: pointer; transition: 0.2s; }
    .card-front:hover, .card-front:active { background: #eee; border-color: var(--accent); }
    .upload-hint { font-size: 50px; color: #ccc; pointer-events: none; }
    .uploaded-img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; display: block; }

    .card-back { background: #1d1d1f; color: white; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; font-size: 180px; font-weight: 900; font-family: 'Inter', sans-serif; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: none; z-index: 1; }

    .slider-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; background: white; border-radius: 50%; border: 1px solid #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); z-index: 20; transition: opacity 0.5s; }
    .nav-left { left: 20px; } .nav-right { right: 20px; }
    
    .overlay-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0); z-index: 9999; display: none; pointer-events: none; }
    .overlay-backdrop.active { display: block; }
    .blur-layer { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); opacity: 0; transition: opacity 0.5s; z-index: 9998; pointer-events: none; }
    .overlay-backdrop.active .blur-layer { opacity: 1; }
    .zoom-ghost { position: absolute; border-radius: 20px; box-shadow: 0 50px 100px rgba(0,0,0,0.3); transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1); pointer-events: none; z-index: 10000; background: #fff; }

    /* --- UI - Sidebar (Responsive) --- */
    .sidebar { 
        position: fixed; 
        top: 50%; right: 24px; transform: translateY(-50%); 
        background: rgba(255,255,255,0.75); 
        padding: 8px; border-radius: 20px; 
        box-shadow: 0 10px 40px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.5); 
        z-index: 5000; 
        display: flex; flex-direction: column; gap: 12px; align-items: center; 
        backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); 
        width: 64px; 
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .sidebar.collapsed { transform: translate(140%, -50%); }

    /* 移动端适配 CSS */
    @media (max-width: 900px) {
        .sidebar {
            top: auto; bottom: 20px; right: 50%; transform: translateX(50%) !important;
            flex-direction: row; width: 92%; max-width: 400px; height: 70px;
            padding: 0 15px; justify-content: space-between; overflow-x: auto;
            border-radius: 35px;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .sidebar.collapsed { transform: translateX(50%) translate(0, 150%) !important; }
        
        .tool-group { border-bottom: none; border-right: 1px solid rgba(0,0,0,0.06); padding-bottom: 0; padding-right: 10px; width: auto; flex-direction: row; }
        .tool-group:last-child { border: none; }
        .sidebar-toggle-btn { display: none; } /* 移动端不需要侧边收缩按钮 */
        
        /* 移动端调整属性面板位置，避免遮挡 */
        .prop-panel { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) !important; width: 90%; background: white; box-shadow: 0 5px 20px rgba(0,0,0,0.15); border-radius: 16px; padding: 10px; flex-direction: row; flex-wrap: wrap; justify-content: center; }
        
        /* 隐藏移动端不常用的复杂工具 */
        #layer-props, #align-props { display: none !important; } 
    }

    .tool-btn { 
        width: 44px; height: 44px; border-radius: 12px; 
        border: none; background: rgba(255,255,255,0.6); 
        cursor: pointer; font-size: 18px; 
        display: flex; align-items: center; justify-content: center; 
        transition: all 0.2s; color: #444; position:relative; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        flex-shrink: 0;
    }
    .tool-btn:hover, .tool-btn:active { background: var(--accent); color: white; }
    .tool-btn.active-tool { background: #1d1d1f; color: #fff; }
    .tool-btn.active-state { background: #fff0f0; color: #ff4d4f; border: 1px solid #ff4d4f; }
    .tool-btn.mini { width: 36px; height: 36px; font-size: 14px; } /* 移动端稍微加大 */

    /* Input rows */
    .input-row { display: flex; gap: 4px; align-items: center; }
    .num-input { width: 40px; height: 30px; border: 1px solid #ccc; border-radius: 6px; text-align: center; }
    .color-picker { width: 36px; height: 36px; padding: 0; border: none; border-radius: 50%; overflow: hidden; }

    /* Thumb UI */
    .thumb-btn { position: absolute; bottom: 40px; right: 40px; width: 60px; height: 60px; border-radius: 50%; background: #333; color: #fff; border: 4px solid #fff; font-size: 24px; cursor: pointer; z-index: 2000; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    /* 移动端调整大拇指位置 */
    @media (max-width: 900px) {
        .thumb-btn { bottom: 100px; right: 20px; width: 50px; height: 50px; font-size: 20px; }
        .clear-storage-btn { bottom: 100px; right: 80px; }
    }
    
    .clear-storage-btn { position: absolute; bottom: 40px; right: 120px; width: 40px; height: 40px; border-radius: 50%; background: #eee; color: #666; border: none; font-size: 14px; cursor: pointer; z-index: 2000; display: flex; align-items: center; justify-content: center; opacity: 0.8; transition: 0.2s; }
    .clear-storage-btn:active { opacity: 1; background: #ffccc7; color: #ff4d4f; }

    /* Pin & String */
    .pin { 
        position: absolute; width: 14px; height: 14px; background: #ff4d4f; border: 2px solid #fff; 
        border-radius: 50%; z-index: 1000; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3); 
        transform: translate(-50%, -50%); transition: transform 0.2s; pointer-events: auto;
    }
    .string-svg-layer { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 900; overflow: visible; }
    .detective-string { fill: none; stroke: #ff4d4f; stroke-width: 2px; stroke-dasharray: 5,5; animation: dash 1s linear infinite; opacity: 0.8; }
    @keyframes dash { to { stroke-dashoffset: -10; } }

    /* Lusion Font */
    .lusion-title-wrap { display: flex; justify-content: center; align-items: baseline; gap: 0px; font-family: 'Inter', sans-serif; line-height: 1.2; white-space: nowrap; overflow: visible; padding-bottom: 10px; }
    .char-box { position: relative; display: inline-block; overflow: hidden; height: 1.2em; vertical-align: baseline; }
    .char-scroll { display: flex; flex-direction: column; transform: translateY(0); will-change: transform; }
    .char-scroll span { display: block; height: 1.2em; line-height: 1.2; text-align: center; }
    .runner-l { display: inline-block; transition: transform 0.1s ease-out; will-change: transform; cursor: default; }

    /* Edit Modal */
    #edit-title-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 6000; display: none; align-items: center; justify-content: center; }
    #edit-title-modal.active-modal { display: flex; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .edit-box { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: 1px solid #eee; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
    .edit-box h3 { margin: 0 0 10px 0; font-family: 'Inter'; font-weight: 800; }
    .edit-inp { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; font-family: inherit; width: 100%; }
    .edit-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .btn-save { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn-cancel { background: #eee; color: #333; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }

    .edit-trigger { position: absolute; top: -40px; right: 0; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.05); color: #333; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; opacity: 0; z-index: 200; }
    .comp:hover .edit-trigger { opacity: 1; }

  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="overlay-backdrop" id="zoomOverlay">
    <div class="blur-layer"></div>
  </div>

  <div class="sidebar" id="main-sidebar">
    <div class="sidebar-toggle-btn" onclick="toggleSidebar()">›</div>
    
    <div class="tool-group">
        <button class="tool-btn" onclick="undo()" title="撤销">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
        </button>
    </div>

    <div class="tool-group">
        <button class="tool-btn" onclick="triggerInput('inp-img')" title="插入图片">🖼</button>
        <button class="tool-btn" onclick="triggerInput('inp-model')" title="插入 3D 模型">🧊</button>
        <button class="tool-btn" onclick="spawnText()" title="插入文本">T</button>
    </div>
    
    <div class="tool-group prop-panel" id="text-props">
        <div class="input-row">
            <button class="tool-btn mini" onclick="adjFontSize(-2)">A-</button>
            <input type="number" id="font-size-val" class="num-input" value="32" onchange="applyFontSize(this.value)">
            <button class="tool-btn mini" onclick="adjFontSize(2)">A+</button>
        </div>
        <div class="input-row">
            <button class="tool-btn mini icon-heavy" onclick="toggleBold()">B</button>
            <button class="tool-btn mini" onclick="toggleItalic()" style="font-family:serif; font-style:italic;">I</button>
            <input type="color" id="text-color" class="color-picker" oninput="applyColor(this.value)">
        </div>
        <div class="input-row">
             <button class="tool-btn mini" onclick="alignText('left')">←</button>
             <button class="tool-btn mini" onclick="alignText('center')">=</button>
        </div>
    </div>
    
    <div class="tool-group prop-panel" id="align-props">
        <div class="group-label">对齐</div>
        <div class="input-row">
            <button class="tool-btn mini" onclick="alignSelection('left')">|←</button>
            <button class="tool-btn mini" onclick="alignSelection('h-center')">→|←</button>
            <button class="tool-btn mini" onclick="alignSelection('right')">→|</button>
        </div>
    </div>

    <div class="tool-group prop-panel" id="layer-props">
        <div class="input-row">
            <button class="tool-btn mini" onclick="changeLayer(1)">↥</button>
            <button class="tool-btn mini" onclick="changeLayer(-1)">↧</button>
            <button class="tool-btn mini" id="btn-lock" onclick="toggleLock()">🔓</button>
        </div>
    </div>

    <div class="tool-group">
        <button class="tool-btn" id="btn-pin" onclick="toggleTool('pin')">📌</button>
        <button class="tool-btn" id="btn-string" onclick="toggleTool('string')">🧶</button>
        <div class="input-row" style="margin-top:4px;" title="连线/图钉颜色">
            <input type="color" id="tool-color" class="color-picker" value="#ff4d4f">
        </div>
    </div>
    
    <div class="tool-group" id="delete-group" style="display:none;">
        <button class="tool-btn" onclick="confirmDelete()" style="color:#ff4d4f; border-color:#ffdbdb; background:#fff5f5;">🗑</button>
    </div>

    <div style="flex:1;"></div>

    <div class="tool-group" style="border-top: 1px solid rgba(0,0,0,0.1); padding-top:12px; background:rgba(255,255,255,0.4); border-radius:12px;">
        <div class="input-row">
            <button class="tool-btn mini" onclick="moveSlide(-1)" style="font-size:10px;">Pg↑</button>
            <button class="tool-btn mini" onclick="moveSlide(1)" style="font-size:10px;">Pg↓</button>
        </div>
        <div class="input-row" style="margin-top:6px;">
            <button class="tool-btn" onclick="addNewSlide()" style="color:#00CC66;">+</button>
            <button class="tool-btn" onclick="saveProject()" style="color:#2953FF;">💾</button>
        </div>
    </div>
  </div>

  <div id="edit-title-modal">
      <div class="edit-box">
          <h3>编辑标题</h3>
          <div><input type="text" id="inp-title-1" class="edit-inp" value="INTELLIGENT"></div>

    window.uploadCardImg = (el) => {
        currentCardTarget = el;

    };

    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxWidth = 600; // Mobile optimization
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height *= maxWidth / width;
                    width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                callback(dataUrl);
            }
        }
    }

    cardUploadInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0] && currentCardTarget) {
            const file = e.target.files[0];
            const idx = currentCardTarget.getAttribute('data-index');
            compressImage(file, (dataUrl) => {
                applyImageToElement(currentCardTarget, dataUrl);
                try {
                    localStorage.setItem('flip_card_img_' + idx, dataUrl);
                } catch (e) { alert('缓存已满'); }
            });
        }
        e.target.value = '';
    });

    function applyImageToElement(el, src) {
        el.innerHTML = '';
        const img = document.createElement('img');
        img.src = src;
        img.className = 'uploaded-img';
        el.appendChild(img);
        el.style.border = 'none';
        el.style.background = '#fff';
    }

    window.restoreCardImages = () => {
        const fronts = document.querySelectorAll('.card-front');
        fronts.forEach(el => {
            const idx = el.getAttribute('data-index');
            const storedImg = localStorage.getItem('flip_card_img_' + idx);
            if (storedImg) applyImageToElement(el, storedImg);
        });

        ghost.style.top = rect.top + 'px';

        ghost.style.objectFit = 'cover'; 
        
        overlay.appendChild(ghost);
        ghost.offsetHeight; 

        const winW = window.innerWidth;
        const winH = window.innerHeight;
        const naturalW = sourceImg.naturalWidth;
        const naturalH = sourceImg.naturalHeight;
        
        const maxW = winW * 0.95;
        const maxH = winH * 0.95;
        const scale = Math.min(maxW / naturalW, maxH / naturalH);
        
        const targetW = naturalW * scale;
        const targetH = naturalH * scale;
        const targetLeft = (winW - targetW) / 2;
        const targetTop = (winH - targetH) / 2;

        ghost.style.objectFit = 'contain';
        ghost.style.left = targetLeft + 'px';
        ghost.style.top = targetTop + 'px';
        ghost.style.width = targetW + 'px';
        ghost.style.height = targetH + 'px';
        ghost.style.boxShadow = '0 100px 200px rgba(0,0,0,0.5)';
        
        ghost.dataset.origLeft = rect.left;
        ghost.dataset.origTop = rect.top;
        ghost.dataset.origWidth = rect.width;
        ghost.dataset.origHeight = rect.height;
        
        // Mobile dismissal
        ghost.onclick = zoomOut;
    }

            ghost.style.left = ghost.dataset.origLeft + 'px';

            ghost.style.width = ghost.dataset.origWidth + 'px';
            ghost.style.height = ghost.dataset.origHeight + 'px';
            ghost.style.objectFit = 'cover'; 
            ghost.style.boxShadow = '0 50px 100px rgba(0,0,0,0.3)';

    function createComp(parent, data, delayIdx) {
      const comp = document.createElement('div');
      let animClass = 'animate-in';
      if (data.anim === 'top') animClass = 'anim-top';
      if (data.anim === 'bottom') animClass = 'anim-bottom';
      if (data.anim === 'tl') animClass = 'corner-tl';
      if (data.anim === 'tr') animClass = 'corner-tr';
      if (data.anim === 'bl') animClass = 'corner-bl';
      if (data.anim === 'br') animClass = 'corner-br';
      if (data.anim === 'paper') animClass = 'paper-slap';

      comp.className = `comp ${animClass}`;
      comp.style.left = data.x + 'px'; comp.style.top = data.y + 'px';
      comp.style.width = data.w + 'px'; comp.style.height = data.h + 'px';
      comp.style.animationDelay = (delayIdx * 50) + 'ms';
      comp.style.zIndex = 10;

      if (data.type === 'ph') {
        comp.classList.add('placeholder');
        comp.dataset.type = 'media';
        comp.innerHTML = `<div class="comp-content"><div>+</div></div>`;
      } else if (data.type === 'media') {
         comp.dataset.type = 'media';
      } else {
        comp.dataset.type = 'text';
        comp.innerHTML = `<div class="comp-content" contenteditable="true" style="font-size:${data.s}px; font-weight:${data.wgt||400}; color:${data.color||'#1d1d1f'}; text-align:${data.align||'left'}; font-family:${data.font==='mono'?'var(--font-mono)':'inherit'};">${data.t}</div>`;
      }
      comp.innerHTML += `<div class="drag-bar"></div><div class="resize-handle"></div>`;
      parent.appendChild(comp);
      return comp;
    }

    // --- Adapted Event Handling for Mobile & Desktop ---
    function setupDelegatedEvents() {
      // Unified Handler
      const handleStart = (e) => {
        const target = e.target;
        const frame = target.closest('.slide-frame');
        const comp = target.closest('.comp');
        const ptr = getPointerPos(e);

        if(toolMode === 'pin' && frame) {
           e.stopPropagation(); e.preventDefault();
           saveState();
           const rect = frame.getBoundingClientRect();
           const scale = getScale();
           createPin(frame, (ptr.clientX - rect.left) / scale, (ptr.clientY - rect.top) / scale);
           return;
        }
        if(toolMode === 'string') {
           const clickedPin = target.closest('.pin');
           if(clickedPin) {
             e.stopPropagation(); e.preventDefault();
             if(!firstPin) { firstPin = clickedPin; clickedPin.classList.add('active-pin'); } 
             else { if(firstPin !== clickedPin) { saveState(); createString(clickedPin.closest('.slide-frame'), firstPin, clickedPin); } firstPin.classList.remove('active-pin'); firstPin = null; }
           }
           return;
        }

        if(!comp && !target.closest('.sidebar')) { 
            if(selectedElements.size > 0) {
                selectedElements.forEach(el => el.classList.remove('selected'));
                selectedElements.clear();
                selectedComp = null; 
                updateUIState();
            }
            return; 
        }

        if(comp) {
          if(comp.dataset.type === 'text' && target.closest('.comp-content')) { 
              if(comp.classList.contains('locked')) { e.stopPropagation(); return; }
              // Mobile text focus helper
              target.closest('.comp-content').focus();
              if(!selectedElements.has(comp)) {
                  selectedElements.forEach(el => el.classList.remove('selected'));
                  selectedElements.clear();
                  selectedElements.add(comp);
                  comp.classList.add('selected');
                  selectedComp = comp;
              }
              return; 
          }

          if (e.type !== 'touchstart') e.stopPropagation(); 
          
          if(e.shiftKey) {
              if(selectedElements.has(comp)) {
                  selectedElements.delete(comp);
                  comp.classList.remove('selected');
              } else {
                  selectedElements.add(comp);
                  comp.classList.add('selected');
              }
              selectedComp = selectedElements.size === 1 ? comp : null;
          } else {
              if(!selectedElements.has(comp)) {
                  selectedElements.forEach(el => el.classList.remove('selected'));
                  selectedElements.clear();
                  selectedElements.add(comp);
                  comp.classList.add('selected');
                  selectedComp = comp;
              }
          }
          
          updateUIState();

          if(comp.classList.contains('locked')) return;
          if(target.classList.contains('resize-handle')) startResize(e, comp); 
          else startDragMulti(e);
        }
      };

      scroller.addEventListener('mousedown', handleStart);
      scroller.addEventListener('touchstart', handleStart, {passive: false});
    }

    function createString(frame, p1, p2) {

      const x2 = parseFloat(p2.style.left), y2 = parseFloat(p2.style.top);
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("class", "detective-string");
      path.style.stroke = toolColorInput.value; 
      const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2 + 50;
      path.setAttribute("d", `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
      svg.appendChild(path);
    }

    window.alignSelection = (mode) => {
        if(selectedElements.size === 0) return;
        saveState();
        const els = Array.from(selectedElements);
        if(els.length === 1) {
            const el = els[0];
            const slideW = 1600; 
            const slideH = 900;  
            const elW = el.offsetWidth;
            const elH = el.offsetHeight;
            if(mode === 'h-center') el.style.left = (slideW - elW) / 2 + 'px';
            if(mode === 'v-center') el.style.top = (slideH - elH) / 2 + 'px';
            return;
        }

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        els.forEach(el => {
            const x = parseFloat(el.style.left);
            const y = parseFloat(el.style.top);
            const w = el.offsetWidth;
            const h = el.offsetHeight;
            if(x < minX) minX = x;
            if(x + w > maxX) maxX = x + w;
            if(y < minY) minY = y;
            if(y + h > maxY) maxY = y + h;
        });

        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;

        els.forEach(el => {
           if(mode === 'left') el.style.left = minX + 'px';
           if(mode === 'h-center') el.style.left = (centerX - el.offsetWidth / 2) + 'px';
           if(mode === 'right') el.style.left = (maxX - el.offsetWidth) + 'px';
           if(mode === 'top') el.style.top = minY + 'px';
           if(mode === 'v-center') el.style.top = (centerY - el.offsetHeight / 2) + 'px';
           if(mode === 'bottom') el.style.top = (maxY - el.offsetHeight) + 'px';
        });
    }

    function startDragMulti(e) {
      if(e.cancelable) e.preventDefault(); // Stop mobile scroll
      const ptr = getPointerPos(e);
      const startX = ptr.clientX, startY = ptr.clientY;
      const scale = getScale();
      
      const initialPositions = new Map();
      selectedElements.forEach(el => {
          if(!el.classList.contains('locked')) {
              initialPositions.set(el, {
                  left: el.offsetLeft,
                  top: el.offsetTop
              });
          }
      });

      const move = (ev) => { 
          if(ev.cancelable) ev.preventDefault();
          const p = getPointerPos(ev);
          const dx = (p.clientX - startX) / scale;
          const dy = (p.clientY - startY) / scale;
          
          initialPositions.forEach((pos, el) => {
              el.style.left = (pos.left + dx) + 'px';
              el.style.top = (pos.top + dy) + 'px';
          });
      };
      
      const up = () => { 
          window.removeEventListener('mousemove', move); 
          window.removeEventListener('touchmove', move); 
          window.removeEventListener('mouseup', up); 
          window.removeEventListener('touchend', up);
          saveState(); 
      };
      
      window.addEventListener('mousemove', move); 
      window.addEventListener('touchmove', move, {passive: false});
      window.addEventListener('mouseup', up);
      window.addEventListener('touchend', up);
    }

    function startResize(e, comp) { 
        if(comp.classList.contains('locked')) return; 
        if(e.cancelable) e.preventDefault();
        
        const ptr = getPointerPos(e);
        const startX = ptr.clientX, startY = ptr.clientY; 
        const startW = comp.offsetWidth, startH = comp.offsetHeight; 
        const scale = getScale(); 
        
        const move = (ev) => { 
             if(ev.cancelable) ev.preventDefault();
             const p = getPointerPos(ev);
             comp.style.width = Math.max(50, startW + (p.clientX - startX) / scale) + 'px'; 
             comp.style.height = Math.max(30, startH + (p.clientY - startY) / scale) + 'px'; 
        }; 
        
        const up = () => { 
            window.removeEventListener('mousemove', move); 
            window.removeEventListener('touchmove', move);
            window.removeEventListener('mouseup', up); 
            window.removeEventListener('touchend', up);
            saveState(); 
        }; 
        
        window.addEventListener('mousemove', move); 
        window.addEventListener('touchmove', move, {passive:false});
        window.addEventListener('mouseup', up); 
        window.addEventListener('touchend', up);
    }

    function restoreModels() { document.querySelectorAll('[data-model-data]').forEach(el => { init3D(el, el.dataset.modelData, el.dataset.modelExt); }); }
    window.spawnText = () => { saveState(); const frame = getActiveFrame(); const c = createComp(frame, { type:'text', t:'New Text', x:200, y:200, w:400, h:60, s:32 }, 0); selectedElements.clear(); selectedElements.add(c); c.classList.add('selected'); updateUIState(); };
    window.confirmDelete = () => { 
        if(selectedElements.size > 0) { 
            let locked = false; selectedElements.forEach(el => { if(el.classList.contains('locked')) locked = true; });
            if(locked) { alert('Locked!'); return; }
            if(confirm("Delete?")) { 
                saveState(); 
                selectedElements.forEach(el => el.remove()); 
                selectedElements.clear(); 
                updateUIState(); 
            } 
        } 
    };

    window.saveProject = () => { const clone = document.documentElement.cloneNode(true); clone.querySelectorAll('.selected').forEach(el => el.classList.remove('selected')); clone.querySelectorAll('.active-tool').forEach(el => el.classList.remove('active-tool')); clone.querySelectorAll('.loader-overlay').forEach(el => el.remove()); const sb = clone.querySelector('.sidebar'); if(sb) sb.classList.remove('has-selection'); const htmlContent = "<!DOCTYPE html>" + clone.outerHTML; const blob = new Blob([htmlContent], {type: 'text/html'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'AIGC_Smartphone_Exploration.html'; a.click(); };
    function getActiveFrame() { const idx = Math.round(scroller.scrollTop / window.innerHeight); return document.querySelectorAll('.slide-frame')[idx] || document.querySelector('.slide-frame'); }
    
    // Updated Scale Logic for Mobile Width Fitting
    function getScale() { 
        const isMobile = window.innerWidth < 900;
        // On mobile, aggressively fit the width (even if letterboxed vertically)
        const wRatio = (window.innerWidth * (isMobile ? 0.95 : 0.96)) / 1600;
        const hRatio = (window.innerHeight * 0.96) / 900;
        return isMobile ? wRatio : Math.min(wRatio, hRatio); 
    }
    
    function fitSlides() { document.documentElement.style.setProperty('--scale', getScale()); }
    function setupObserver() { const obs = new IntersectionObserver((entries) => { entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('active'); else e.target.classList.remove('active'); }); }, { threshold: 0.5 }); document.querySelectorAll('section').forEach(s => obs.observe(s)); }

    function init3D(container, dataUrl, ext) {
      try {
          const w = container.clientWidth; const h = container.clientHeight;
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 1000); camera.position.z = 5;
          const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true }); renderer.setSize(w, h);
          container.appendChild(renderer.domElement);
          const controls = new OrbitControls(camera, renderer.domElement); controls.autoRotate = true;
          scene.add(new THREE.AmbientLight(0xffffff, 1.2));
          const dl = new THREE.DirectionalLight(0xffffff, 1.5); dl.position.set(5,10,7); scene.add(dl);
          const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
          const onLoad = (obj) => { obj.traverse(c => { if(c.isMesh) c.material = mat; }); const box = new THREE.Box3().setFromObject(obj); const center = box.getCenter(new THREE.Vector3()); const size = box.getSize(new THREE.Vector3()); const max = Math.max(size.x, size.y, size.z); obj.scale.setScalar(3.5/max); obj.position.sub(center.multiplyScalar(3.5/max)); scene.add(obj); };
          if(ext === 'obj') new OBJLoader().load(dataUrl, onLoad); else new GLTFLoader().load(dataUrl, (g) => onLoad(g.scene));
          function anim() { requestAnimationFrame(anim); controls.update(); renderer.render(scene, camera); }
          anim();
      } catch(e) { console.error("3D Load Error", e); }
    }

    function initNetworkBackground() {
      const canvas = document.getElementById('bg-canvas');
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000);
      camera.position.z = 100;
      
      // Reduce particles on mobile for performance
      const isMobile = window.innerWidth < 900;
      const count = isMobile ? 50 : 100; 
      
      const pos = new Float32Array(count*3);
      const vel = [];
      for(let i=0; i<count; i++) { pos[i*3] = (Math.random()-0.5)*300; pos[i*3+1] = (Math.random()-0.5)*200; pos[i*3+2] = (Math.random()-0.5)*100; vel.push({x:(Math.random()-0.5)*0.15, y:(Math.random()-0.5)*0.15}); }
      const parts = new THREE.BufferGeometry(); parts.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const pMat = new THREE.PointsMaterial({ color: 0xFF4D00, size: 2, transparent:true, opacity:0.4 });
      const pSys = new THREE.Points(parts, pMat); scene.add(pSys);
      const lMat = new THREE.LineBasicMaterial({ color: 0x999999, transparent: true, opacity: 0.1 });
      const lGeo = new THREE.BufferGeometry(); const lines = new THREE.LineSegments(lGeo, lMat); scene.add(lines);
      function animate() {
        requestAnimationFrame(animate);
        const pPos = pSys.geometry.attributes.position.array;
        for(let i=0; i<count; i++) { pPos[i*3] += vel[i].x; pPos[i*3+1] += vel[i].y; if(Math.abs(pPos[i*3])>160) vel[i].x *= -1; if(Math.abs(pPos[i*3+1])>100) vel[i].y *= -1; }
        pSys.geometry.attributes.position.needsUpdate = true;
        const lPos = [];
        for(let i=0; i<count; i++) { for(let j=i+1; j<count; j++) { const dx = pPos[i*3]-pPos[j*3]; const dy = pPos[i*3+1]-pPos[j*3+1]; if(dx*dx+dy*dy < 1500) { lPos.push(pPos[i*3], pPos[i*3+1], pPos[i*3+2], pPos[j*3], pPos[j*3+1], pPos[j*3+2]); } } }
        lGeo.setAttribute('position', new THREE.Float32BufferAttribute(lPos, 3));
        renderer.render(scene, camera);
      }
      animate();
      window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); fitSlides(); });
    }

    init();
  </script>
</body>
</html>
